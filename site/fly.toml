# Fly.io app config for the Fun4Kids site.
# App name must be globally unique on Fly — change it below if
# "fun4kids-asbl" is already taken (you'll see a clear error on first deploy).
app = "fun4kids-asbl"
primary_region = "cdg"  # Paris — closest Fly region to Enghien, Belgium

[build]

[env]
  PORT = "8080"

# Persistent volume: this is what makes inscriptions durable across
# restarts/redeploys (unlike a typical serverless host). Created once via
# the "Fly: one-time setup" GitHub Action before the first deploy.
[[mounts]]
  source = "fun4kids_data"
  destination = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
